# ─────────────────────────────────────────────────────────────
#  YZ Radar — ayarlar
#  Bu dosyayı GitHub'da kalem simgesiyle düzenleyebilirsin.
#  Değişiklikler bir sonraki çalışmada (en geç ~10 dk) devreye girer.
# ─────────────────────────────────────────────────────────────

site:
  name: "YZ Radar"
  tagline: "Yapay zeka dünyasından önemli gelişmeler, kaynağıyla."
  description: "Dünyadaki yapay zeka gelişmelerini derleyen, her haberde orijinal kaynağı gösteren Türkçe haber sitesi."
  # Boş bırakırsan GitHub Pages adresi otomatik kullanılır.
  # Kendi alan adını bağlarsan buraya yaz: "https://yzradar.com"
  url: ""
  posts_per_page: 18
  contact_email: ""        # Hakkında sayfasında görünür (boş bırakılabilir)
  instagram: ""            # Örn: "yzradar" (2. aşamada kullanılacak)

seo:
  # Ana sayfanın Google'da görünen başlığı ve açıklaması
  home_title: "Yapay Zeka Haberleri: Güncel YZ Gelişmeleri"
  home_description: "ChatGPT, Gemini, Claude ve dünyadaki tüm yapay zeka gelişmeleri. Kaynağıyla, Türkçe ve her gün güncel yapay zeka haberleri."
  # Arama motoru doğrulama kodları (Search Console / Bing / Yandex'in verdiği "content" değeri)
  google_site_verification: ""
  bing_site_verification: ""
  yandex_verification: ""
  # Yeni haberleri Bing ve Yandex'e anında bildir (ücretsiz, hesap gerekmez)
  indexnow: true
  featured_count: 5        # Ana sayfadaki kaydırmalı manşette kaç haber olsun

schedule:
  timezone: "Europe/Istanbul"
  collect_every_minutes: 60      # Kaynaklar kaç dakikada bir taransın
  daily_summary_hour: 21         # Günlük özet Telegram'a saat kaçta gelsin
  quiet_hours: [0, 8]            # Bu saatler arasında bildirimler sessiz gelir
  listen_seconds: 120            # Bekleyen haber varsa, butonlara hızlı tepki için bekleme süresi

editorial:
  min_importance: 6              # 1-10 arası. Bunun altındaki haberler hiç önüne gelmez
  max_drafts_per_run: 5          # Bir taramada en fazla kaç yeni haber taslağı yazılsın
  max_drafts_per_day: 25         # Günlük üst sınır (maliyet kontrolü)
  max_item_age_hours: 36         # Bundan eski haberler atlanır
  pending_expire_hours: 36       # Onaylanmayan taslak bu süre sonunda düşer
  fetch_full_text: true          # Haberin tam metnini kaynağından okuyup daha doğru özet çıkar

autonomy:
  # manuel  : her haber onayına gelir
  # ogrenen : kararlarından öğrenir; güvendiği kaynaklardan gelen net haberleri kendisi yayınlar (önerilen)
  # tam     : sadece şüpheli/riskli haberleri sorar, gerisini kendisi yayınlar
  # Telegram'dan /mod komutuyla da değiştirebilirsin.
  mode: ogrenen
  source_min_decisions: 10       # Bir kaynağa güvenmek için gereken en az karar sayısı
  source_min_approval: 0.9       # ...ve o kaynaktaki onay oranı
  global_window: 30              # Genel başarı için bakılan son karar sayısı
  global_min_approval: 0.85      # Son kararlarda genel onay oranı bunun altındaysa otomatik yayın durur
  auto_min_importance: 6         # Otomatik yayın için en düşük önem puanı

images:
  # kapak: habere özel tipografik kapak (dev rakam / isim / manşet), ücretsiz (önerilen)
  # 3d   : eski renkli 3D şekiller
  style: kapak
  # Her habere yapay zeka ile özel görsel (Google "Nano Banana").
  # GEMINI_API_KEY gizli anahtarı yoksa ya da üretim başarısız olursa
  # habere özgü 3D stüdyo görseli (ücretsiz yedek) kullanılır.
  ai: false                              # ücretli (Google ödeme gerektirir). Açmak için: true
  model: "gemini-3.1-flash-lite-image"   # daha kaliteli: "gemini-3.1-flash-image"
  cost_per_image: 0.035                  # sadece maliyet raporu için (dolar)

social:
  # Yayınlanan her haber için Instagram post + story görsellerini Telegram'a gönder
  # (Instagram otomasyonu 2. aşamada; o zamana kadar elle paylaşabilirsin).
  send_to_telegram: true

ai:
  # gemini: Google Gemini ücretsiz katmanı (kredi kartı gerekmez, günlük sınırlı)
  # claude: Anthropic Claude (ücretli, ANTHROPIC_API_KEY gerekir)
  provider: gemini
  triage_model: "gemini-flash-lite-latest"   # ayıklama
  writer_model: "gemini-flash-latest"        # haber yazımı
  # Claude'a geçersen örnek: triage_model "claude-haiku-4-5-20251001", writer_model "claude-sonnet-5"
  writer_effort: "medium"                    # sadece Claude için

# ─────────────────────────────────────────────────────────────
#  Kaynaklar
#  kind: official (şirketin kendi duyurusu), media (haber sitesi), community (topluluk)
#  type: rss (varsayılan) | html (RSS'i olmayan sayfalar için)
#  Bir kaynağı kapatmak için başına # koy.
# ─────────────────────────────────────────────────────────────
sources:
  # Resmi duyurular
  - name: OpenAI
    url: https://openai.com/news/rss.xml
    kind: official
  - name: Anthropic
    url: https://www.anthropic.com/news
    type: html
    link_pattern: '^/news/[a-z0-9-]+/?$'
    kind: official
  - name: Google DeepMind
    url: https://deepmind.google/blog/rss.xml
    kind: official
  - name: Google Research
    url: https://research.google/blog/rss/
    kind: official
  - name: Google
    url: https://blog.google/technology/ai/rss/
    kind: official
  - name: NVIDIA
    url: https://blogs.nvidia.com/feed/
    kind: official
  - name: Hugging Face
    url: https://huggingface.co/blog/feed.xml
    kind: official

  # Haber siteleri
  - name: TechCrunch
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    kind: media
  - name: The Verge
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    kind: media
  - name: MIT Technology Review
    url: https://www.technologyreview.com/topic/artificial-intelligence/feed
    kind: media
  - name: VentureBeat
    url: https://venturebeat.com/category/ai/feed/
    kind: media
  - name: Ars Technica
    url: https://arstechnica.com/ai/feed/
    kind: media
  - name: Webrazzi
    url: https://webrazzi.com/kategori/yapay-zeka/feed/
    kind: media

  # Topluluk (bağlantılar orijinal habere gider; kaynak olarak o site gösterilir)
  - name: Hacker News
    url: https://hnrss.org/newest?q=AI+OR+LLM+OR+OpenAI+OR+Anthropic+OR+Gemini&points=150
    kind: community
    credit_linked_site: true
